name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed to attach the APK to a Release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.3"
          cache: true

      - name: Show Flutter + Dart version
        run: |
          flutter --version
          dart --version

      # The repo only tracks `mobile/lib` + `mobile/pubspec.yaml`; Android
      # platform files are generated on every build so we never have to
      # hand-maintain gradle / manifest boilerplate.
      #
      # `flutter create` will happily overwrite our hand-authored pubspec,
      # so we swap it out for the duration of scaffolding, then restore.
      - name: Generate Android platform files
        working-directory: mobile
        run: |
          set -eux
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --project-name camo --org app.camo .
          mv pubspec.yaml.bak pubspec.yaml
          ls -la android/app/src/main/ || true

      - name: Fetch dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --verbose

      # Installable APK — signed with the default Flutter debug key so it's
      # side-loadable without a keystore. For Play Store release add a
      # proper signing config under mobile/android/key.properties.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camo-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
