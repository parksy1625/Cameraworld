name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed to attach the APK to a Release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.3"
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # Pubspec is hand-authored, so back it up before `flutter create`
      # (which happily overwrites it) and restore afterwards.
      - name: Generate Android platform files
        working-directory: mobile
        run: |
          set -eux
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --project-name camo --org app.camo .
          mv pubspec.yaml.bak pubspec.yaml
          echo "---- main manifest ----"
          cat android/app/src/main/AndroidManifest.xml || true
          echo "---- app/build.gradle ----"
          cat android/app/build.gradle || true

      - name: Fetch dependencies
        working-directory: mobile
        run: flutter pub get

      # Depth Anything v2 Small TFLite → real semantic depth in local mode.
      # Bundled into the APK when a mirror resolves. Misses are tolerated:
      # the app falls back to classical pseudo-depth, and Base is fetched at
      # runtime on first launch regardless.
      - name: Download Depth Anything v2 Small TFLite
        working-directory: mobile
        continue-on-error: true
        run: |
          set -x
          mkdir -p assets/models
          dst="assets/models/depth_anything_v2_small.tflite"
          urls=(
            "https://github.com/parksy1625/Cameraworld/releases/download/models/depth_anything_v2_small.tflite"
            "https://huggingface.co/litert-community/depth-anything-v2-small/resolve/main/depth_anything_v2_small.tflite"
            "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/depth_anything_v2_small.tflite"
            "https://github.com/PINTO0309/PINTO_model_zoo/releases/download/TFLite/depth_anything_v2_small_fp16.tflite"
          )
          for u in "${urls[@]}"; do
            echo "trying: $u"
            if curl -fL --retry 2 --max-time 120 -o "$dst" "$u"; then
              sz=$(stat -c %s "$dst" 2>/dev/null || wc -c <"$dst")
              if [ "$sz" -gt 1048576 ]; then   # must be > 1MB to be real
                ls -la "$dst" && break
              fi
            fi
            rm -f "$dst"
          done
          if [ ! -f "$dst" ]; then
            echo "::warning::Depth Anything v2 Small not bundled — classical fallback will be used until runtime download"
          fi

      - name: Analyze (non-blocking)
        working-directory: mobile
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Debug APK is side-loadable and doesn't run R8/minify, which is the
      # most common cause of first-build failures with plugins like
      # geolocator / webview_flutter. We also capture the full build log
      # to a file so it can be downloaded as an artifact on failure.
      - name: Build debug APK
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee ../build-log.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camo-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
