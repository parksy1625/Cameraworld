name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed to attach the APK to a Release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.3"
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # Pubspec is hand-authored, so back it up before `flutter create`
      # (which happily overwrites it) and restore afterwards.
      - name: Generate Android platform files
        working-directory: mobile
        run: |
          set -eux
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --project-name camo --org app.camo .
          mv pubspec.yaml.bak pubspec.yaml
          echo "---- main manifest ----"
          cat android/app/src/main/AndroidManifest.xml || true
          echo "---- app/build.gradle ----"
          cat android/app/build.gradle || true

      - name: Fetch dependencies
        working-directory: mobile
        run: flutter pub get

      # MiDaS small TFLite → real semantic depth in local mode. Optional:
      # if every mirror is down the app falls back to classical pseudo-depth,
      # so we don't fail the build when the download misses.
      - name: Download MiDaS TFLite model
        working-directory: mobile
        continue-on-error: true
        run: |
          set -x
          mkdir -p assets/models
          urls=(
            "https://github.com/PINTO0309/PINTO_model_zoo/raw/main/153_MiDaS_small/saved_model_midas_small_256x256/model_float16_quant.tflite"
            "https://huggingface.co/Intel/MiDaS-small/resolve/main/midas_v2_1_small_256x256.tflite"
            "https://storage.googleapis.com/tfhub-lite-models/intel/lite-model/midas/v2_1_small/1/lite/1.tflite"
          )
          for u in "${urls[@]}"; do
            echo "trying: $u"
            if curl -fL --retry 2 --max-time 60 -o assets/models/midas.tflite "$u"; then
              ls -la assets/models/midas.tflite && break
            fi
            rm -f assets/models/midas.tflite
          done
          if [ ! -f assets/models/midas.tflite ]; then
            echo "::warning::MiDaS model not available — app will fall back to classical depth"
          fi

      - name: Analyze (non-blocking)
        working-directory: mobile
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Debug APK is side-loadable and doesn't run R8/minify, which is the
      # most common cause of first-build failures with plugins like
      # geolocator / webview_flutter. We also capture the full build log
      # to a file so it can be downloaded as an artifact on failure.
      - name: Build debug APK
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee ../build-log.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camo-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
