plugins {
    id 'com.android.application'
}

android {
    namespace 'com.signalrelay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.signalrelay.app'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '1.6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // AI remains fully on-device. Networking is used only for record/photo synchronization.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.1'
}
