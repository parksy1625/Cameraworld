plugins {
    id 'com.android.application'
}

android {
    namespace 'com.signalrelay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.signalrelay.app'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ONNX Runtime native Android runtime is packaged into the APK at build time.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.1'
}
