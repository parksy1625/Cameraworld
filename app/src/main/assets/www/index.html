<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Signal Relay V1.5</title><style>:root{--bg:#06101a;--g:rgba(255,255,255,.09);--s:rgba(255,255,255,.14);--t:#f7fbff;--m:#a8b7c9;--b:#7cc5ff;--ok:#5ce1b8;--y:#ffd166;--r:#ff7f96}*{box-sizing:border-box}body{margin:0;color:var(--t);font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 0,#173f66 0,transparent 32%),radial-gradient(circle at 90% 10%,#372c67 0,transparent 30%),linear-gradient(155deg,#06101a,#0b1929);min-height:100vh}.app{max-width:820px;margin:auto;padding:16px 14px 105px}.glass,.card,dialog{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.055));border:1px solid var(--s);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 55px #0006}.top{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:21px}.muted{color:var(--m);font-size:11px}.pill{padding:7px 10px;border:1px solid var(--s);border-radius:999px;color:var(--ok);font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{padding:14px;border-radius:18px}.stat strong{display:block;font-size:24px}.hero{margin-top:10px;padding:16px;border-radius:20px}.hero h2{font-size:16px;margin:0 0 6px}.hero p{margin:0;color:var(--m);font-size:12px;line-height:1.6}.toolbar{display:flex;gap:8px;margin:14px 0}.search,input,select,textarea{width:100%;background:#ffffff0d;color:white;border:1px solid var(--s);border-radius:13px;padding:11px;outline:none}.search{flex:1}.btn{border:1px solid #ffffff35;border-radius:14px;padding:12px;background:linear-gradient(#fff,#dcefff);color:#07111f;font-weight:700}.btn.sec{background:#ffffff10;color:white}.list .item{margin:9px 0;padding:12px;border-radius:18px;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center}.thumb{width:54px;height:54px;border-radius:13px;object-fit:cover;background:#ffffff12}.item h4{font-size:13px;margin:0 0 4px}.item p{font-size:11px;color:var(--m);margin:0}.badge{font-size:10px;padding:6px 8px;border:1px solid var(--s);border-radius:999px}.fab{position:fixed;right:20px;bottom:80px;width:62px;height:62px;border:0;border-radius:50%;font-size:30px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#081523e8;backdrop-filter:blur(24px);border-top:1px solid var(--s);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--m);font-size:10px}.nav button.on{color:white}.view{display:none}.view.on{display:block}.map{height:57vh;border-radius:20px;margin-top:10px;position:relative;overflow:hidden;background:linear-gradient(140deg,#0d2338,#071522)}canvas{width:100%;height:100%}.form{padding:15px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:5px}.capture{display:block;text-align:center;padding:24px;border:1px dashed #ffffff3b;border-radius:17px}.capture input{display:none}.preview{max-height:260px;width:100%;object-fit:cover;border-radius:14px;display:none}.info{padding:11px;border:1px solid var(--s);border-radius:14px;background:#ffffff0b;margin:10px 0}.info p{font-size:11px;color:var(--m);white-space:pre-line}dialog{width:min(700px,calc(100% - 18px));max-height:94vh;border-radius:22px;color:white;padding:0}dialog::backdrop{background:#000a}.head{position:sticky;top:0;display:flex;justify-content:space-between;padding:14px 16px;background:#091827ee;border-bottom:1px solid var(--s)}.head button{background:none;border:0;color:white;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.row{grid-template-columns:1fr}.item{grid-template-columns:50px 1fr}.item .badge{grid-column:2;justify-self:start}}</style></head><body><div class="app"><div class="top"><div class="brand"><b>Signal Relay <span class="muted">V1.5</span></b><div class="muted">신호 미조치 인수인계 · Native AI</div></div><span class="pill">● OFFLINE</span></div><section id="home" class="view on"><div class="stats"><div class="glass stat"><strong id="cOpen">0</strong><span class="muted">미조치</span></div><div class="glass stat"><strong id="cHigh">0</strong><span class="muted">긴급</span></div><div class="glass stat"><strong id="cWork">0</strong><span class="muted">작업중</span></div></div><div class="glass hero"><h2>사진으로 남기고 다음 조가 이어서 작업</h2><p>카메라·GPS·신호설비 온디바이스 ONNX 분석·인계 기록을 네트워크 없이 처리합니다.</p></div><div class="toolbar"><input id="q" class="search" placeholder="설비명 · 위치 · 내용 검색" oninput="render()"><button class="btn" onclick="openNew()">＋</button></div><div id="list" class="list"></div></section><section id="map" class="view"><div class="glass map"><canvas id="cv"></canvas></div><div id="mapList" class="list"></div></section><section id="history" class="view"><div id="doneList" class="list"></div></section><section id="settings" class="view"><div class="glass form"><div class="field"><label>작업자</label><input id="worker"></div><div class="field"><label>기본 노선</label><input id="line"></div><button class="btn" onclick="saveSettings()">설정 저장</button></div><div class="glass form" style="margin-top:10px"><b>Android Native Vision AI</b><div id="aiState" class="info"><p>상태 확인 중</p></div><div class="field"><label>ONNX 모델 설치</label><input id="model" type="file" accept=".onnx"></div><div class="field"><label>클래스</label><textarea id="classes">신호기,선로전환기,ATS지상자,발리스,궤도회로,임피던스본드,본드선,케이블,케이블트로프,신호기구함,전원설비,접지,표지류,파손,이탈,케이블노출,부식,잡초,침수,이물질</textarea></div><button class="btn" onclick="installModel()">모델 설치</button><button class="btn sec" onclick="removeModel()" style="margin-top:8px">모델 삭제</button></div></section></div><button class="fab" onclick="openNew()">＋</button><nav class="nav"><button class="on" onclick="show('home',this)">⌂<br>인계</button><button onclick="show('map',this)">⌖<br>지도</button><button onclick="show('history',this)">✓<br>완료</button><button onclick="show('settings',this)">⚙<br>설정</button></nav><dialog id="dlg"><div class="head"><b>새 미조치 기록</b><button onclick="dlg.close()">×</button></div><form class="form" onsubmit="saveIssue(event)"><label class="capture"><input id="photo" type="file" accept="image/*" capture="environment" onchange="pickPhoto(event)"><img id="preview" class="preview"><span id="photoText">📷 사진 촬영</span></label><div class="row"><div class="field"><label>설비 분류</label><select id="cat"><option>선로전환기</option><option>신호기</option><option>ATS / ATP</option><option>궤도회로</option><option>임피던스본드 / 본드류</option><option>케이블 트로프</option><option>케이블</option><option>신호기구함</option><option>전원설비</option><option>기타</option></select></div><div class="field"><label>설비명</label><input id="eq" placeholder="P21B"></div></div><div class="field"><label>역/구간</label><input id="loc"></div><div class="field"><label>GPS</label><input id="gps" readonly><button type="button" class="btn sec" onclick="getGps()" style="margin-top:6px">현재 위치</button></div><div class="field"><label>미조치 제목</label><input id="title" required></div><div class="info"><b>Vision AI</b><p id="aiText">사진 촬영 후 분석하세요.</p><button type="button" class="btn sec" onclick="analyze()">기기 내 AI 분석</button></div><div class="field"><label>인계 내용</label><textarea id="desc"></textarea></div><div class="row"><div class="field"><label>우선순위</label><select id="pri"><option value="normal">일반</option><option value="priority">우선</option><option value="high">긴급</option></select></div><div class="field"><label>미조치 사유</label><select id="reason"><option>시간 부족</option><option>자재 필요</option><option>인원 필요</option><option>작업협의 필요</option><option>열차운행/차단 관계</option><option>기타</option></select></div></div><button class="btn">미조치 등록</button></form></dialog><dialog id="detail"><div class="head"><b>인계 상세</b><button onclick="detail.close()">×</button></div><div id="detailBody" class="form"></div></dialog><script>const $=x=>document.getElementById(x),K='signal-relay-v15';let img='',pos=null;let records=JSON.parse(localStorage.getItem(K)||'[]');const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const save=()=>localStorage.setItem(K,JSON.stringify(records));function show(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();if(id==='map')setTimeout(drawMap,80)}function openNew(){img='';pos=null;$('dlg').querySelector('form').reset();$('preview').style.display='none';$('photoText').style.display='inline';$('gps').value='';$('dlg').showModal();getGps()}function pickPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{img=r.result;$('preview').src=img;$('preview').style.display='block';$('photoText').style.display='none'};r.readAsDataURL(f)}function getGps(){if(!navigator.geolocation)return $('gps').value='GPS 미지원';$('gps').value='위치 수집 중';navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gps').value=`${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)} ±${Math.round(pos.accuracy)}m`},()=>{$('gps').value='위치 권한 없음'},{enableHighAccuracy:true,timeout:8000})}function native(){return typeof NativeAI!=='undefined'}function updateAI(){try{let x=native()?JSON.parse(NativeAI.getRuntimeInfo()):{installed:false,loaded:false,provider:'N/A'};$('aiState').innerHTML=`<p>${x.installed?'모델 설치됨':'모델 미설치'} · ${x.loaded?'로드됨':'미로드'} · ${x.provider||''}</p>`}catch(e){$('aiState').innerHTML='<p>AI 상태 확인 실패</p>'}}async function installModel(){let f=$('model').files[0];if(!f||!native())return;let d=await new Promise(r=>{let q=new FileReader;q.onload=()=>r(q.result);q.readAsDataURL(f)});let x=JSON.parse(NativeAI.installModel(d));alert(x.message||x.error);updateAI()}function removeModel(){if(native()&&confirm('모델 삭제?')){alert(JSON.parse(NativeAI.removeModel()).message);updateAI()}}function labels(){return $('classes').value.split(',').map(x=>x.trim()).filter(Boolean)}function mapCat(a){let j=a.join(' ');for(let [c,k] of [['선로전환기',['선로전환기']],['신호기',['신호기']],['ATS / ATP',['ATS지상자','발리스']],['궤도회로',['궤도회로']],['임피던스본드 / 본드류',['임피던스본드','본드선']],['케이블 트로프',['케이블트로프']],['케이블',['케이블']]])if(k.some(x=>j.includes(x)))return c;return''}function analyze(){if(!img||!native())return alert('사진과 설치된 모델이 필요합니다.');let x=JSON.parse(NativeAI.analyze(img,labels().join(','),.35,.45));if(!x.ok)return $('aiText').textContent=x.error;let ls=(x.detections||[]).map(d=>d.label),bad=[...new Set(ls.filter(x=>['파손','이탈','케이블노출','부식','잡초','침수','이물질'].includes(x)))],eq=ls.find(x=>!bad.includes(x))||'신호설비',c=mapCat(ls);if(c)$('cat').value=c;$('title').value=bad.length?bad.join(' · ')+' 확인 필요':eq+' 상태 확인 필요';$('desc').value=bad.length?`사진에서 ${eq} 주변에 ${bad.join(', ')} 항목이 검출되었습니다. 현장 상태를 확인하고 필요한 조치를 이어서 시행 바랍니다.`:`사진에서 ${eq}가 인식되었습니다. 현장에서 인계사항을 확인·보완해 주세요.`;$('aiText').textContent=`${x.provider} · ${Math.round(x.elapsedMs||0)}ms\n`+(x.detections||[]).slice(0,8).map(d=>d.label+' '+Math.round(d.score*100)+'%').join(' · ')}function saveIssue(e){e.preventDefault();records.unshift({id:Date.now(),createdAt:new Date().toISOString(),category:$('cat').value,equipmentName:$('eq').value,section:$('loc').value,gps:pos,title:$('title').value,description:$('desc').value,priority:$('pri').value,reason:$('reason').value,status:'pending',photo:img,worker:localStorage.worker||''});save();$('dlg').close();render()}function render(){let open=records.filter(x=>x.status!=='done'),q=($('q')?.value||'').toLowerCase();$('cOpen').textContent=open.length;$('cHigh').textContent=open.filter(x=>x.priority==='high').length;$('cWork').textContent=open.filter(x=>x.status==='working').length;$('list').innerHTML=open.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).map(card).join('')||'<p class="muted">미조치가 없습니다.</p>';$('doneList').innerHTML=records.filter(x=>x.status==='done').map(card).join('')||'<p class="muted">완료 이력이 없습니다.</p>';$('mapList').innerHTML=open.filter(x=>x.gps).map(card).join('')}function card(x){return`<div class="glass item" onclick="openDetail(${x.id})">${x.photo?`<img class="thumb" src="${x.photo}">`:'<div class="thumb"></div>'}<div><h4>${esc(x.equipmentName||x.category)} · ${esc(x.title)}</h4><p>${esc(x.section)} · ${esc(x.reason)}</p></div><span class="badge">${x.priority==='high'?'긴급':x.status}</span></div>`}function openDetail(id){let x=records.find(v=>v.id===id);$('detailBody').innerHTML=`${x.photo?`<img class="preview" style="display:block" src="${x.photo}">`:''}<h3>${esc(x.title)}</h3><p class="muted">${esc(x.description)}</p><div class="info"><p>${esc(x.equipmentName||x.category)} · ${esc(x.section)}<br>${x.gps?x.gps.lat.toFixed(6)+', '+x.gps.lng.toFixed(6):'GPS 없음'}</p></div>${x.status==='done'?'<p>조치완료</p>':`<div class="row"><button class="btn sec" onclick="status(${id},'working')">작업시작</button><button class="btn" onclick="complete(${id})">조치완료</button></div>`}`;$('detail').showModal()}function status(id,s){let x=records.find(v=>v.id===id);x.status=s;save();detail.close();render()}function complete(id){let x=records.find(v=>v.id===id),n=prompt('조치 내용');if(n===null)return;x.status='done';x.completedAt=new Date().toISOString();x.completionNote=n;save();detail.close();render()}function drawMap(){let c=$('cv'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let g=c.getContext('2d');g.scale(d,d);let pts=records.filter(x=>x.status!=='done'&&x.gps),W=r.width,H=r.height;g.fillStyle='#0a2033';g.fillRect(0,0,W,H);g.strokeStyle='#ffffff12';for(let i=25;i<W;i+=35){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke()}for(let i=25;i<H;i+=35){g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}g.fillStyle='#ffffff99';g.fillText('OFFLINE GPS MAP',14,20);if(!pts.length)return;let la=pts.map(x=>x.gps.lat),lo=pts.map(x=>x.gps.lng),a=Math.min(...la)-.0001,b=Math.max(...la)+.0001,l=Math.min(...lo)-.0001,u=Math.max(...lo)+.0001;pts.forEach(x=>{let px=30+(x.gps.lng-l)/(u-l)*(W-60),py=H-30-(x.gps.lat-a)/(b-a)*(H-60);g.fillStyle=x.priority==='high'?'#ff7f96':'#7cc5ff';g.beginPath();g.arc(px,py,7,0,Math.PI*2);g.fill();g.fillStyle='white';g.fillText((x.equipmentName||x.category).slice(0,12),px+10,py-8)})}function saveSettings(){localStorage.worker=$('worker').value;localStorage.line=$('line').value;alert('저장 완료')}window.onload=()=>{$('worker').value=localStorage.worker||'';$('line').value=localStorage.line||'';render();updateAI()};</script></body></html>
