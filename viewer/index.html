<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cameraworld Viewer</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #hud input {
        padding: 4px 6px;
        font-size: 13px;
        width: 260px;
      }
      #hud button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <input id="capture-id" placeholder="capture UUID" />
      <button id="load">Load</button>
      <button id="toggle-splat">Splat overlay</button>
      <span id="status"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
