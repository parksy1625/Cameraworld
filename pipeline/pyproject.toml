[project]
name = "cameraworld-pipeline"
version = "0.1.0"
description = "Cameraworld GPU reconstruction pipeline (COLMAP + 3DGS)"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "redis>=5.0",
  "rq>=1.16",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "imagehash>=4.3",
  "Pillow>=10.2",
  "pyproj>=3.6",
  "tqdm>=4.66",
  "py3dtiles>=7.0",
  "typer>=0.12",
  "plyfile>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cameraworld_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
