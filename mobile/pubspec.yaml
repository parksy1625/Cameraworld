name: cameraworld_mobile
description: Cameraworld capture app — photos & video uploads for 3D reconstruction.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  geolocator: ^12.0.0
  sensors_plus: ^6.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
