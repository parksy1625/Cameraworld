<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>camo 3D point cloud</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; color: #d5e2f5;
               font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hud { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px;
         background: rgba(0,0,0,.45); border-radius: 12px; font-size: 12px; }
  #hud .k { color: #7bd6ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span class="k" id="count">0</span> pts · drag rotate · pinch zoom</div>
<script>
/* ── minimal WebGL point-cloud viewer ─────────────────────────────────────
   Loaded by the Flutter WebView. Flutter calls `camoLoadPoints(b64)`
   where b64 is base64-encoded float32 [x,y,z,r,g,b, ...] interleaved.
   No external deps; works fully offline. */
(() => {
  const canvas = document.getElementById('c');
  const countEl = document.getElementById('count');
  const gl = canvas.getContext('webgl', { antialias: true, premultipliedAlpha: false });
  if (!gl) { document.body.innerHTML = '<p style="padding:20px">WebGL unavailable</p>'; return; }

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const vsrc = `
    attribute vec3 aPos;
    attribute vec3 aColor;
    uniform mat4 uProj;
    uniform mat4 uView;
    uniform float uSize;
    varying vec3 vColor;
    void main() {
      gl_Position = uProj * uView * vec4(aPos, 1.0);
      gl_PointSize = uSize;
      vColor = aColor;
    }`;
  const fsrc = `
    precision mediump float;
    varying vec3 vColor;
    void main() {
      vec2 d = gl_PointCoord - vec2(0.5);
      if (dot(d, d) > 0.25) discard;          /* round points */
      gl_FragColor = vec4(vColor, 1.0);
    }`;
  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  const aCol = gl.getAttribLocation(prog, 'aColor');
  const uProj = gl.getUniformLocation(prog, 'uProj');
  const uView = gl.getUniformLocation(prog, 'uView');
  const uSize = gl.getUniformLocation(prog, 'uSize');

  const buf = gl.createBuffer();
  let nPts = 0;

  function setPoints(f32) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, f32, gl.STATIC_DRAW);
    const stride = 4 * 6;
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(aCol);
    gl.vertexAttribPointer(aCol, 3, gl.FLOAT, false, stride, 4 * 3);
    nPts = f32.length / 6;
    countEl.textContent = nPts.toLocaleString();
  }

  // ── camera (orbit) ─────────────────────────────────────────────────────
  let yaw = 0.4, pitch = 0.2, dist = 3.5;
  let autoSpin = true;

  const view = new Float32Array(16), proj = new Float32Array(16);
  function perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out.fill(0);
    out[0] = f / aspect; out[5] = f;
    out[10] = (far + near) * nf; out[11] = -1;
    out[14] = 2 * far * near * nf;
  }
  function lookAt(out, ex, ey, ez, cx, cy, cz, ux, uy, uz) {
    let zx = ex - cx, zy = ey - cy, zz = ez - cz;
    let zl = 1 / Math.hypot(zx, zy, zz); zx *= zl; zy *= zl; zz *= zl;
    let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
    let xl = 1 / Math.hypot(xx, xy, xz); xx *= xl; xy *= xl; xz *= xl;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * ex + xy * ey + xz * ez);
    out[13] = -(yx * ex + yy * ey + yz * ez);
    out[14] = -(zx * ex + zy * ey + zz * ez);
    out[15] = 1;
  }

  function render() {
    const aspect = canvas.width / canvas.height;
    perspective(proj, Math.PI / 3, aspect, 0.01, 100);
    const ex = dist * Math.cos(pitch) * Math.sin(yaw);
    const ey = dist * Math.sin(pitch);
    const ez = dist * Math.cos(pitch) * Math.cos(yaw);
    lookAt(view, ex, ey, ez, 0, 0, 0, 0, 1, 0);
    gl.clearColor(0.043, 0.071, 0.125, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (nPts > 0) {
      gl.useProgram(prog);
      gl.uniformMatrix4fv(uProj, false, proj);
      gl.uniformMatrix4fv(uView, false, view);
      gl.uniform1f(uSize, Math.max(1.5, 3.0 * dpr));
      gl.drawArrays(gl.POINTS, 0, nPts);
    }
    if (autoSpin) yaw += 0.004;
    requestAnimationFrame(render);
  }
  render();

  // ── input ──────────────────────────────────────────────────────────────
  let dragging = false, lastX = 0, lastY = 0;
  let pinchStart = 0, distStart = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY; autoSpin = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yaw -= dx * 0.006;
    pitch += dy * 0.006;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  canvas.addEventListener('wheel', (e) => {
    dist *= Math.exp(e.deltaY * 0.001);
    dist = Math.max(0.5, Math.min(20, dist));
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('dblclick', () => { autoSpin = !autoSpin; });

  // Simple two-finger pinch via Touch events for older webviews.
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStart = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      distStart = dist;
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStart > 0) {
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      dist = Math.max(0.5, Math.min(20, distStart * (pinchStart / d)));
      e.preventDefault();
    }
  }, { passive: false });

  // ── Flutter bridge ─────────────────────────────────────────────────────
  window.camoLoadPoints = (b64) => {
    const raw = atob(b64);
    const buf = new ArrayBuffer(raw.length);
    const u8 = new Uint8Array(buf);
    for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    setPoints(new Float32Array(buf));
  };
  window.camoClear = () => { nPts = 0; countEl.textContent = '0'; };

  // tiny seed point so the canvas isn't empty before Flutter injects data
  setPoints(new Float32Array([0, 0, 0, 0.5, 0.7, 1.0]));
})();
</script>
</body>
</html>
